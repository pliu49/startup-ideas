      <p class="hero-desc" data-i18n="hero.desc"></p>

        </div>
        <div>
          <div class="hero-stat-num">5+</div>
          <div class="hero-stat-label" data-i18n="hero.stat.certs"></div>
        </div>
        <div>
          <div class="hero-stat-num">5</div>
          <div class="hero-stat-label" data-i18n="hero.stat.colors"></div>

</section>

    <div class="section-head">

    <div class="cat-grid">
      <a href="shop.html?series=magic" class="cat-card">

      <a href="shop.html?series=folio" class="cat-card">

    <a href="about.html#contact" class="btn btn-primary" data-i18n="section.cta.button"></a>

<div id="site-footer"></div>
