<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us — MonsterDangDang 怪兽当当</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="about-hero">
  <div class="container">
    <h1 data-i18n="about.title"></h1>
    <p data-i18n="about.tagline"></p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="mv-grid">
      <div class="mv-card">
        <h3 data-i18n="about.mission.title"></h3>
        <p data-i18n="about.mission.desc"></p>
      </div>
      <div class="mv-card">
        <h3 data-i18n="about.vision.title"></h3>
        <p data-i18n="about.vision.desc"></p>
      </div>
    </div>

    <div class="section-head" style="text-align:left;max-width:none;margin-bottom:20px;">
      <h2 class="section-title" style="font-size:26px;" data-i18n="about.intro.title"></h2>
    </div>
    <p style="color:var(--ink-soft);font-size:15px;line-height:1.8;margin-bottom:16px;max-width:820px;" data-i18n="about.intro.p1"></p>
    <p style="color:var(--ink-soft);font-size:15px;line-height:1.8;max-width:820px;" data-i18n="about.intro.p2"></p>

    <div class="section-head" style="text-align:left;max-width:none;margin:48px 0 8px;">
      <h2 class="section-title" style="font-size:26px;" data-i18n="about.values.title"></h2>
    </div>
    <div class="values-grid">
      <div class="value-item" data-i18n="about.values.1"></div>
      <div class="value-item" data-i18n="about.values.2"></div>
      <div class="value-item" data-i18n="about.values.3"></div>
      <div class="value-item" data-i18n="about.values.4"></div>
    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <div class="section-head" style="text-align:left;max-width:none;margin-bottom:12px;">
      <h2 class="section-title" style="font-size:26px;" data-i18n="about.quality.title"></h2>
    </div>
    <p style="color:var(--ink-soft);font-size:15px;line-height:1.8;max-width:760px;margin-bottom:24px;" data-i18n="about.quality.desc"></p>

    <div class="section-head" style="text-align:left;max-width:none;margin-bottom:8px;">
      <h2 class="section-title" style="font-size:20px;" data-i18n="about.certs.title"></h2>
    </div>
    <div class="certs-row">
      <span class="cert-chip">CE</span>
      <span class="cert-chip">FCC</span>
      <span class="cert-chip">RoHS</span>
      <span class="cert-chip">ISEGA</span>
      <span class="cert-chip">NATO Supply Standard</span>
      <span class="cert-chip">Boeing Manufacturing Standard</span>
      <span class="cert-chip">IPC-A-610</span>
    </div>
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title" data-i18n="about.contact.title"></h2>
      <p class="section-desc" data-i18n="section.cta.desc"></p>
    </div>
    <div class="contact-grid">
      <div class="contact-card">
        <h4 data-i18n="about.contact.address"></h4>
        <p data-i18n="about.contact.addressValue"></p>
      </div>
      <div class="contact-card">
        <h4 data-i18n="about.contact.phone"></h4>
        <p><a href="tel:15686086666">+86 156 8608 6666</a></p>
      </div>
      <div class="contact-card">
        <h4 data-i18n="about.contact.email"></h4>
        <p><a href="mailto:980686092@qq.com">980686092@qq.com</a></p>
      </div>
    </div>
    <div style="text-align:center;margin-top:40px;">
      <a href="mailto:980686092@qq.com" class="btn btn-primary" data-i18n="section.cta.button"></a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader("about");
  renderFooter();
</script>
</body>
</html>
